name: Build WAYSS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4.5.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor and icon tooling
        run: npm install --no-save @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7 sharp

      - name: Generate Android project
        run: npx cap add android

      - name: Write WAYSS launcher icons into native Android resources
        run: |
          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const source = 'assets/wayss-icon.svg';
          const root = 'android/app/src/main/res';
          const densities = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          (async () => {
            for (const [density, size] of Object.entries(densities)) {
              const dir = path.join(root, 'mipmap-' + density);
              fs.mkdirSync(dir, { recursive: true });
              for (const name of ['ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png']) {
                await sharp(source).resize(size, size).png().toFile(path.join(dir, name));
              }
            }
            const adaptive = path.join(root, 'mipmap-anydpi-v26');
            fs.mkdirSync(adaptive, { recursive: true });
            const xml = name => `<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n  <background android:drawable="@android:color/black"/>\n  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n`;
            fs.writeFileSync(path.join(adaptive, 'ic_launcher.xml'), xml('ic_launcher'));
            fs.writeFileSync(path.join(adaptive, 'ic_launcher_round.xml'), xml('ic_launcher_round'));
            console.log('WAYSS branded launcher resources generated for all Android densities.');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Prepare Capacitor Android assets directory
        run: mkdir -p android/app/src/main/assets/public

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: WAYSS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
