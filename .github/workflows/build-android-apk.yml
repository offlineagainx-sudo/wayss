name: Build WAYSS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4.5.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: npm install --no-save @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7

      - name: Generate Android project
        run: npx cap add android

      - name: Prepare Capacitor asset directories
        run: mkdir -p public android/app/src/main/assets/public

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: WAYSS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
